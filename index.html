<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Where is CODE?</title>
  <link rel="icon" href="logo.svg" type="image/svg+xml">
  <link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&display=swap">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css">
  <link rel="stylesheet" href="style.css">
  <script>
    // Apply the saved day/night theme before first paint to avoid a flash of the wrong colors.
    try {
      if (localStorage.getItem("theme") === "light") document.documentElement.dataset.theme = "light";
    } catch {}
  </script>
</head>
<body>
  <header class="site-header">
    <img class="logo" src="logo.svg" alt="">
    <h1 class="site-title" aria-label="Where is CODE?">
      <span id="title-text" aria-hidden="true"></span><span class="title-cursor" aria-hidden="true"></span>
    </h1>
    <div class="status-bar"><b id="stat-mapped">0</b> mapped</div>
    <button id="view-toggle" class="theme-toggle" type="button" aria-label="2D map" aria-pressed="false">◍ Globe</button>
    <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Day mode" aria-pressed="false">☾ Night</button>
    <button id="join-button" class="join-button" type="button">Join the map</button>
  </header>

  <div id="clock-strip" class="clock-strip" aria-label="World clocks"></div>

  <div class="layout">
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <h2>Members</h2>
        <button id="sidebar-toggle" class="sidebar-toggle" aria-label="Collapse members sidebar" aria-expanded="true">&#x2039;</button>
      </div>

      <div class="sidebar-content">
        <div class="search-row">
          <input id="member-search" type="search" placeholder="Search members" aria-label="Search members">
          <div class="filter">
            <button id="filter-toggle" class="filter-toggle" aria-expanded="false" aria-controls="filter-panel">Filter</button>
            <div id="filter-panel" class="filter-panel" hidden>
              <div id="filter-fields" class="filter-fields"></div>
            </div>
          </div>
        </div>

        <div id="region-bar" class="region-bar" hidden>
          <div class="region-top">
            <div class="region-title">
              <span class="region-label">Area</span>
              <strong id="region-name"></strong>
              <span id="region-count" class="region-count"></span>
            </div>
            <button id="region-close" class="sidebar-toggle" type="button" aria-label="Clear selected area">&times;</button>
          </div>
          <div class="region-levels" role="group" aria-label="Area level">
            <button type="button" data-region-level="country" aria-pressed="false">Country</button>
            <button type="button" data-region-level="state" aria-pressed="false">State</button>
          </div>
        </div>

        <h3 class="list-heading"><span>Members <span id="list-count"></span></span><span id="distance-origin"></span></h3>
        <ul id="member-list" class="member-list"></ul>
      </div>
    </aside>

    <main id="map"></main>
    <div id="map-hint" class="map-hint">Click a country or US state to explore it</div>

    <div class="map-tools">
      <div class="tool timeline-tool">
        <button id="timeline-play" class="tool-button" type="button" aria-label="Play timeline">▶</button>
        <label class="tool-label" for="timeline">Class of</label>
        <input id="timeline" type="range" step="1" min="0" max="0" value="0">
        <output id="timeline-value" for="timeline" class="tool-value">—</output>
      </div>
    </div>

    <aside id="profile-panel" class="profile-panel" aria-labelledby="profile-title" hidden>
      <div class="sidebar-header">
        <h2 id="profile-title">My Profile</h2>
        <button id="profile-close" class="sidebar-toggle" type="button" aria-label="Close profile">&times;</button>
      </div>

      <form id="profile-form" class="profile-form" novalidate>
        <div class="photo-row">
          <div id="photo-preview" class="member-avatar photo-preview"></div>
          <div class="photo-actions">
            <label class="text-button">
              Upload photo
              <input id="profile-photo" type="file" accept="image/jpeg,image/png,image/webp" hidden>
            </label>
            <button id="photo-remove" class="text-button" type="button">Remove</button>
          </div>
        </div>

        <label class="field">
          <span>Name <em>*</em></span>
          <input name="name" type="text" maxlength="80" autocomplete="name" required>
        </label>

        <label class="field">
          <span>Class year <em>*</em></span>
          <input name="year" type="number" min="1950" max="2100" inputmode="numeric" required>
        </label>

        <div class="field city-field">
          <label for="profile-city">City <em>*</em></label>
          <input id="profile-city" name="city" type="text" autocomplete="off" placeholder="Start typing your city" required
                 role="combobox" aria-autocomplete="list" aria-controls="city-suggestions" aria-expanded="false">
          <ul id="city-suggestions" class="city-suggestions" role="listbox" hidden></ul>
        </div>

        <label class="toggle-field">
          <input name="live_mode" type="checkbox">
          <span>
            <strong>Live mode</strong>
            Show me in the city I'm in whenever I open the map, instead of the city above. Uses your browser's location, rounded to the city.
          </span>
        </label>

        <label class="field">
          <span>LinkedIn</span>
          <input name="linkedin" type="url" placeholder="https://linkedin.com/in/you">
        </label>

        <label class="field">
          <span>Website</span>
          <input name="website" type="url" placeholder="https://yoursite.com">
        </label>

        <details class="more-options">
          <summary>More options</summary>

          <label class="field">
            <span>Heritage</span>
            <select name="heritage"><option value="">Choose a country</option></select>
          </label>

          <label class="field">
            <span>Industry</span>
            <input name="industry" type="text" maxlength="60" list="industry-options" placeholder="Technology">
            <datalist id="industry-options">
              <option value="Technology"></option>
              <option value="Finance"></option>
              <option value="Consulting"></option>
              <option value="Venture Capital / Private Equity"></option>
              <option value="Entrepreneurship / Startups"></option>
              <option value="Healthcare"></option>
              <option value="Real Estate"></option>
              <option value="Marketing"></option>
              <option value="Media & Entertainment"></option>
              <option value="Consumer Goods"></option>
              <option value="Education"></option>
              <option value="Government / Nonprofit"></option>
              <option value="Energy"></option>
              <option value="Legal"></option>
            </datalist>
          </label>

          <label class="field">
            <span>Company</span>
            <input name="company" type="text" maxlength="80" autocomplete="organization">
          </label>

          <label class="field">
            <span>Ex-CODE position</span>
            <select name="position">
              <option value="">None</option>
              <option>President</option>
              <option>VP</option>
              <option>CM</option>
              <option>VP Role</option>
              <option>Resident</option>
              <option>Associate</option>
            </select>
          </label>

          <label class="field">
            <span>Email</span>
            <input name="email" type="email" maxlength="254" autocomplete="email">
          </label>

          <label class="field">
            <span>Phone</span>
            <input name="phone" type="tel" maxlength="25" autocomplete="tel" placeholder="+1 555 123 4567">
          </label>

          <p class="field-note">Email and phone are only shown to signed-in members.</p>
        </details>

        <p id="profile-status" class="profile-status" role="status"></p>

        <div class="profile-actions">
          <button id="profile-save" class="primary-button" type="submit">Save</button>
          <button id="profile-signout" class="text-button" type="button">Sign out</button>
          <button id="profile-delete" class="danger-button" type="button" hidden>Delete profile</button>
        </div>
      </form>
    </aside>
  </div>

  <script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
  <script src="region.js"></script>
  <script src="tools.js"></script>
  <script src="profile.js"></script>
</body>
</html>
