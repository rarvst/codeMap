<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Where is CODE?</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&display=swap">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="logo" aria-hidden="true">&lt;/&gt;</div>
    <h1 class="site-title" aria-label="Where is CODE?">
      <span id="title-text" aria-hidden="true"></span><span class="title-cursor" aria-hidden="true"></span>
    </h1>
    <div class="status-bar">
      <span>Members <b id="stat-members">0</b></span>
      <span>Cities <b id="stat-cities">0</b></span>
      <span id="stat-clock" class="status-clock"></span>
    </div>
  </header>

  <div class="layout">
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <h2>Members</h2>
        <button id="sidebar-toggle" class="sidebar-toggle" aria-label="Collapse members sidebar" aria-expanded="true">&#x2039;</button>
      </div>

      <div class="sidebar-content">
        <div class="search-row">
          <input id="member-search" type="search" placeholder="Search members" aria-label="Search members">
          <div class="filter">
            <button id="filter-toggle" class="filter-toggle" aria-expanded="false" aria-controls="filter-panel">Filter</button>
            <div id="filter-panel" class="filter-panel" hidden>
              <label>
                Year
                <select id="filter-year"><option value="">All</option></select>
              </label>
              <label>
                City
                <select id="filter-city"><option value="">All</option></select>
              </label>
            </div>
          </div>
        </div>

        <h3 class="list-heading"><span>All Members</span><span id="list-count"></span></h3>
        <ul id="member-list" class="member-list"></ul>
      </div>
    </aside>

    <main id="map"></main>
  </div>

  <script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
